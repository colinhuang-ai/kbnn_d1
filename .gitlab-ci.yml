# CI tương đương .github/workflows/submit-code.yml và Jenkinsfile
#   verify:  unit test -> semgrep -> htmlhint -> lighthouse
#   publish: build + push Docker image (chỉ khi push vào main/master, bỏ qua merge request)
#
# Biến CI/CD cần khai báo (Settings > CI/CD > Variables), nên bật Masked + Protected:
#   DOCKERHUB_USERNAME  - user Docker Hub
#   DOCKERHUB_TOKEN     - Docker Hub access token

stages:
  - test
  - verify
  - publish

variables:
  IMAGE_NAME: hoangpt/kbnn
  SITE_PORT: "8080"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GIT_DEPTH: "20"

# Tránh chạy trùng 2 pipeline (branch + merge request) cho cùng một commit
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

.node:
  image: node:20-alpine
  cache:
    key:
      files:
        - .gitlab-ci.yml
    paths:
      - .npm/

unit-test:
  extends: .node
  stage: test
  script:
    - node --version
    - >
      node --test
      --test-reporter=spec --test-reporter-destination=stdout
      --test-reporter=junit --test-reporter-destination=test-results.xml
      tests/greeting.test.mjs
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: test-results.xml

semgrep:
  stage: verify
  image:
    name: semgrep/semgrep:latest
    entrypoint: [""]
  # --error: fail job khi có finding (giống semgrep-action).
  # --gitlab-sast: xuất đúng định dạng để GitLab hiển thị trong MR widget.
  # Lưu ý: --config auto cần Internet và không dùng chung với --metrics off.
  script:
    - semgrep scan --config auto --error --gitlab-sast --output gl-sast-report.json
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      sast: gl-sast-report.json

htmlhint:
  extends: .node
  stage: verify
  script:
    - npx -y htmlhint index.html

lighthouse:
  stage: verify
  # image đã có sẵn Chromium + Node, thay cho browser-actions/setup-chrome
  image:
    name: zenika/alpine-chrome:with-node
    entrypoint: [""]
  variables:
    CHROME_PATH: /usr/bin/chromium-browser
  script:
    - npx -y http-server . -p "$SITE_PORT" -a 127.0.0.1 --silent > site.log 2>&1 &
    - |
      for i in $(seq 1 15); do
        wget -q -O /dev/null "http://127.0.0.1:${SITE_PORT}/index.html" && break
        sleep 1
      done
    - >
      npx -y lighthouse "http://127.0.0.1:${SITE_PORT}/index.html"
      --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
      --output=html
      --output=json
      --output-path=./lighthouse-report
      --quiet
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      # nhiều --output nên Lighthouse sinh lighthouse-report.report.{html,json}
      - lighthouse-report*
      - site.log

publish-docker-image:
  stage: publish
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")
  before_script:
    - docker buildx version || apk add --no-cache docker-cli-buildx
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    # Cache đẩy lên registry vì GitLab không có cache backend type=gha
    - docker buildx create --name kbnn-builder --driver docker-container --use
    - >
      docker buildx build .
      --file ./Dockerfile
      --tag "${IMAGE_NAME}:latest"
      --tag "${IMAGE_NAME}:sha-${CI_COMMIT_SHORT_SHA}"
      --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}"
      --label "org.opencontainers.image.source=${CI_PROJECT_URL}"
      --label "org.opencontainers.image.version=${CI_COMMIT_SHORT_SHA}"
      --cache-from "type=registry,ref=${IMAGE_NAME}:buildcache"
      --cache-to "type=registry,ref=${IMAGE_NAME}:buildcache,mode=max"
      --push
    - echo "Đã push ${IMAGE_NAME}:latest và ${IMAGE_NAME}:sha-${CI_COMMIT_SHORT_SHA}"
  after_script:
    - docker logout || true
